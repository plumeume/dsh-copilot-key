# DSH Copilot-key launcher configuration - copy to config.ini and edit.
#
#   copy config.example.ini config.ini
#
# Paths may be absolute or relative to the directory holding this file.

# Trigger: winshift-f23 = the Copilot hardware key (LeftWin+LeftShift+F23); f23 = bare F23
trigger = winshift-f23

# Port / URL of a DSH web UI to open when it is already listening
port = 3080
url = http://127.0.0.1:3080

# Started when nothing is listening on the port above (cold start)
launcher = launch-dsh.cmd

# Where the watcher writes its log
log = watcher.log

# 1 = only log the key press, never launch anything (dry run)
dryrun = 0
